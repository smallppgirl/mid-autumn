<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16214d">
  <meta name="description" content="中秋猜灯谜 · Mid-Autumn Lantern Riddles">
  <title>中秋猜灯谜 · Mid-Autumn Riddles</title>
  <link rel="preload" href="assets/bg.jpg" as="image">
  <link rel="preload" href="data/riddles.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1 class="title" data-i18n="title">中秋猜灯谜</h1>
        <p class="subtitle" id="counter"></p>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section class="scene" id="scene">
      <div class="riddle" id="riddle" aria-hidden="true"></div>
      <p class="sr-only" id="riddleText" aria-live="polite"></p>
    </section>

    <section class="controls">
      <button type="button" class="btn btn-random" id="randomBtn">
        <span aria-hidden="true">🏮</span> <span data-i18n="random">换一题</span>
      </button>

      <form class="answer-form" id="answerForm" autocomplete="off">
        <label class="sr-only" for="answerInput" data-i18n="answerLabel">你的答案</label>
        <input id="answerInput" name="answer" type="text" size="1" maxlength="40"
               enterkeyhint="send" autocapitalize="off" spellcheck="false"
               placeholder="输入谜底…" data-i18n-placeholder="placeholder">
        <button type="submit" class="btn btn-submit" id="submitBtn" data-i18n="submit">提交</button>
      </form>

      <div class="attempts" id="attempts" aria-live="polite">
        <span data-i18n="attemptsLabel">剩余机会</span>
        <span class="attempt-icons" id="attemptIcons" aria-hidden="true"></span>
      </div>

      <p class="message" id="message" role="status"></p>

      <button type="button" class="btn btn-won" id="wonBtn" hidden data-i18n="wonBanner">🏆 你已猜中！查看</button>
    </section>

    <footer class="footer" data-i18n="footer">花好月圆 · 中秋快乐</footer>
  </main>

  <div class="congrats" id="congrats" hidden role="dialog" aria-modal="true" aria-labelledby="congratsTitle">
    <div class="petals" id="petals" aria-hidden="true"></div>
    <div class="congrats-card">
      <div class="congrats-moon" aria-hidden="true">🎉</div>
      <h2 id="congratsTitle" data-i18n="congratsTitle">恭喜你，猜中啦！</h2>
      <p class="congrats-sub" data-i18n="congratsSub">花好月圆，阖家团圆</p>
      <p class="congrats-greet" data-i18n="congratsGreet">祝你中秋快乐！</p>
      <p class="congrats-time" id="congratsTime"></p>
      <button type="button" class="btn btn-submit" id="closeCongrats" data-i18n="close">好的</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
